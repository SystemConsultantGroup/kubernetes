apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seminar-redirect
  annotations:
    platform.scg.sh/production-only: "true"
spec:
  hostnames:
    - scg.skku.ac.kr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /seminar
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: seminar.scg.skku.ac.kr
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 308
