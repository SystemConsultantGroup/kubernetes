# Super Computing Center node specific patches
apiVersion: v1alpha1
kind: HostnameConfig
hostname: k8s.scc
auto: off
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 8.8.8.8
  - address: 8.8.4.4
---
machine:
  nodeLabels:
    gateway.scg.sh/listener: "true"
  install:
    diskSelector:
      wwid: naa.600508b1001cc9d1ee77e9fbec5ef031
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: data
provisioning:
  diskSelector:
    match: disk.wwid == "naa.600508b1001c163bf948aff8ec7c6601"
  minSize: 1TB
  grow: true
