global:
  domain: argocd.platform.scg.sh
configs:
  params:
    server.insecure: true
  cm:
    url: https://argocd.platform.scg.sh
    webhook.maxPayloadSizeMB: "10"
    timeout.reconciliation: 120s
    timeout.reconciliation.jitter: 60s
    admin.enabled: false
    dex.config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: Ov23liOiPk0ECCc9Wfgk
            clientSecret: $argocd-github-oauth:github.oauth.clientSecret
            orgs:
              - name: SystemConsultantGroup
                teams:
                  - active
                  - platform
            teamNameField: slug
      staticClients:
        - id: vault
          name: Vault
          redirectURIs:
            - http://localhost:8250/oidc/callback
            - https://vault.platform.scg.sh/ui/vault/auth/oidc/oidc/callback
          secret: $argocd-vault-oidc:oidc.clientSecret
  secret:
    githubSecret: '$argocd-github-webhook:webhook.github.secret'
  rbac:
    policy.csv: |
      g, SystemConsultantGroup:active, role:readonly
    policy.default: role:readonly
    scopes: '[groups]'
applicationSet:
  httproute:
    enabled: true
    annotations:
      external-dns.alpha.kubernetes.io/gateway-hostname-source: annotation-only
      external-dns.alpha.kubernetes.io/hostname: "*.platform.scg.sh"
    parentRefs:
      - name: public
        namespace: gateway-system
        sectionName: platform-https
    hostnames:
      - argocd.platform.scg.sh
    rules:
      - matches:
          - path:
              type: Exact
              value: /applicationset-webhook
        filters:
          - type: URLRewrite
            urlRewrite:
              path:
                type: ReplaceFullPath
                replaceFullPath: /api/webhook
