apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: SCG platform
  sourceRepos:
    - https://github.com/SystemConsultantGroup/kubernetes.git
    - https://github.com/kubernetes-sigs/gateway-api.git
    - https://github.com/rancher/local-path-provisioner.git
    - https://argoproj.github.io/argo-helm
    - https://helm.cilium.io/
    - quay.io/jetstack/charts
    - https://charts.external-secrets.io
    - https://helm.releases.hashicorp.com
    - https://percona.github.io/percona-helm-charts/
    - https://kubernetes-sigs.github.io/external-dns/
    - https://stakater.github.io/stakater-charts
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
