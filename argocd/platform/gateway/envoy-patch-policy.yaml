apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: wasm-cluster-ipv4-dns
  namespace: gateway-system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: public
  type: JSONPatch
  # Envoy Gateway v1.9.1's custom DNS cluster did not resolve this IPv4-only
  # service in the v1.39.1 data plane; use the compatible legacy cluster type.
  jsonPatches:
    - type: type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: wasm_cluster
      operation:
        op: remove
        path: /cluster_type
    - type: type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: wasm_cluster
      operation:
        op: add
        path: /type
        value: STRICT_DNS
    - type: type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: wasm_cluster
      operation:
        op: replace
        path: /dns_lookup_family
        value: V4_ONLY
