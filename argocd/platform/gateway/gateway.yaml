apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: gateway-system
  annotations:
    # Temporary E2S attachment safeguard: keep public DNS on SCC until
    # cross-node Cilium networking and Gateway exposure are validated.
    external-dns.alpha.kubernetes.io/target: "115.145.134.232"
spec:
  gatewayClassName: envoy-gateway
  allowedListeners:
    namespaces:
      from: Selector
      selector:
        matchLabels:
          gateway.scg.sh/public: "true"
  listeners:
    - name: platform-https
      hostname: "*.platform.scg.sh"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: platform-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.scg.sh/public: "true"
    - name: testing-https
      hostname: "*.testing.scg.sh"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: application-wildcards-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.scg.sh/public: "true"
    - name: preview-https
      hostname: "*.preview.scg.sh"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: application-wildcards-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.scg.sh/public: "true"
    # Temporary passthrough from selected scg.skku.ac.kr DNS records to the
    # legacy cluster. DNS controls which hosts reach this listener.
    - name: scg-skku-passthrough
      hostname: "*.scg.skku.ac.kr"
      port: 443
      protocol: TLS
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.scg.sh/public: "true"
