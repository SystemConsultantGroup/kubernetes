apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: public-gateway-ingress
spec:
  description: Restrict testing and preview Gateway hosts to the SCG network
  endpointSelector:
    matchExpressions:
      - key: reserved:ingress
        operator: Exists
  ingress:
    # Keep in-cluster use of every attached route available. This rule does not
    # admit traffic originating outside the cluster.
    - fromEntities:
        - cluster
    # Testing and preview hosts have no public rule below. External clients can
    # therefore reach them only when their source has this CIDR identity.
    - fromCIDRSet:
        - cidr: 115.145.150.0/24
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Platform routes remain public. Managed production hosts are admitted by
    # the per-application policies generated by application-routing-policies.
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          rules:
            http:
              - host: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?\.platform\.scg\.sh$'
              # Bootstrap the production routes that predate generated policy
              # Applications so this policy can roll out without an outage.
              - host: '^example\.scg\.sh$'
              - host: '^manage\.exhibition\.scg\.sh$'
