apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public
  namespace: gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDaemonSet:
        pod:
          nodeSelector:
            gateway.scg.sh/listener: "true"
      envoyService:
        type: ClusterIP
  # Keep this proxy group separate from the former Cilium Envoy hot-restart ID.
  extraArgs:
    - --base-id 1
  mergeGateways: false
