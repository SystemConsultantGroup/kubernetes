apiVersion: v1
kind: Service
metadata:
  name: bunkerweb-origin
  namespace: envoy-gateway-system
spec:
  selector:
    gateway.envoyproxy.io/owning-gateway-name: public
    gateway.envoyproxy.io/owning-gateway-namespace: gateway-system
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: v1
kind: Service
metadata:
  name: bunkerweb-origin
  namespace: gateway-system
spec:
  type: ExternalName
  externalName: bunkerweb-origin.envoy-gateway-system.svc.cluster.local
  ports:
    - name: https
      port: 443
