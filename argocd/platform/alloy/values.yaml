crds:
  create: false
global:
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
alloy:
  enableReporting: false
  configMap:
    content: |
      discovery.kubernetes "application_pods" {
        role = "pod"

        selectors {
          role  = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
        }
      }

      discovery.relabel "application_pods" {
        targets = discovery.kubernetes.application_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_part_of", "__meta_kubernetes_pod_label_platform_scg_sh_instance_type"]
          separator     = ";"
          regex         = "[^;]+;(production|testing|preview|custom)"
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_part_of"]
          target_label  = "application"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_platform_scg_sh_instance_type"]
          target_label  = "instance_type"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "workload"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_id"]
          regex         = "^(\\S+):\\/\\/.+$"
          replacement   = "$1"
          target_label  = "container_runtime"
        }
      }

      loki.source.kubernetes "application_pods" {
        targets    = discovery.relabel.application_pods.output
        forward_to = [loki.process.application_pods.receiver]
      }

      loki.process "application_pods" {
        stage.static_labels {
          values = {
            cluster = "scg",
          }
        }

        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
rbac:
  create: false
controller:
  type: daemonset
  podAnnotations:
    kubernetes.io/egress-bandwidth: "5M"
service:
  enabled: true
  type: ClusterIP
serviceMonitor:
  enabled: true
  additionalLabels:
    release: monitoring
