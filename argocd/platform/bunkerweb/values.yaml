fullnameOverride: bunkerweb
settings:
  existingSecret: bunkerweb-credentials
  apiToken:
    generate: false
    fromExistingSecret: true
  kubernetes:
    ingressClass: bunkerweb
    serviceProtocol: https
    ignoreAnnotations: bunkerweb.io/CONFIG_TYPE
  misc:
    apiWhitelistIp: "127.0.0.0/8 10.244.0.0/23"
service:
  type: ClusterIP
bunkerweb:
  kind: DaemonSet
  hostPorts: true
  nodeSelector:
    gateway.scg.sh/listener: "true"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
ui:
  # The UI is managed in manifests/ui.yaml for separate credentials and persistent state.
  enabled: false
scheduler:
  extraEnvs:
    - name: MAX_CLIENT_SIZE
      value: "0"
  features:
    global:
      disableDefaultServer: "yes"
    timeouts:
      clientBodyTimeout: "300s"
      sendTimeout: "300s"
    reverseProxy:
      reverseProxyReadTimeout: "1800s"
      reverseProxySendTimeout: "300s"
    modsecurity:
      modsecuritySecRequestBodyLimit: "10m"
      modsecuritySecRequestBodyLimitAction: "ProcessPartial"
mariadb:
  strategy: Recreate
  persistence:
    storageClass: local-data
redis:
  strategy: Recreate
  persistence:
    storageClass: local-data
