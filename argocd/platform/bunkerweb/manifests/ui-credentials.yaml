apiVersion: v1
kind: ServiceAccount
metadata:
  name: bunkerweb-ui-vault-auth
  namespace: bunkerweb
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: bunkerweb-ui
  namespace: bunkerweb
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: https://vault.platform.scg.sh
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: bunkerweb-ui
          serviceAccountRef:
            name: bunkerweb-ui-vault-auth
            audiences:
              - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bunkerweb-ui-credentials
  namespace: bunkerweb
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: bunkerweb-ui
  target:
    name: bunkerweb-ui-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin-username
      remoteRef:
        key: platform/bunkerweb/ui
        property: admin-username
    - secretKey: admin-password
      remoteRef:
        key: platform/bunkerweb/ui
        property: admin-password
