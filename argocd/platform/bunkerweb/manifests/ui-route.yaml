apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bunkerweb-ui
  namespace: bunkerweb
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: gateway-system
      sectionName: platform-https
  hostnames:
    - bunkerweb.platform.scg.sh
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: ui-bunkerweb
          port: 7000
          weight: 1
