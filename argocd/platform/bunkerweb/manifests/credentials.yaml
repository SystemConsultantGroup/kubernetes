apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: bunkerweb
  namespace: bunkerweb
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 48
  digits: 10
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bunkerweb-credentials
  namespace: bunkerweb
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: bunkerweb-credentials
    creationPolicy: Orphan
    immutable: true
    template:
      data:
        api-token: "{{ .api }}"
        database-uri: "mariadb+pymysql://bunkerweb:{{ .db }}@mariadb-bunkerweb.bunkerweb.svc.cluster.local:3306/db"
        mariadb-user: bunkerweb
        mariadb-password: "{{ .db }}"
        redis-password: "{{ .redis }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bunkerweb
      rewrite:
        - regexp:
            source: "^password$"
            target: api
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bunkerweb
      rewrite:
        - regexp:
            source: "^password$"
            target: db
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bunkerweb
      rewrite:
        - regexp:
            source: "^password$"
            target: redis
