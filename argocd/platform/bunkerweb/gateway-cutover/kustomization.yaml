apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../gateway
  - origin-policy.yaml
patches:
  - target:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: public
      namespace: gateway-system
    patch: |-
      - op: remove
        path: /spec/provider/kubernetes/envoyDaemonSet/patch
      - op: remove
        path: /spec/provider/kubernetes/useListenerPortAsContainerPort
  - target:
      kind: Service
      name: bunkerweb-origin
      namespace: envoy-gateway-system
    patch: |-
      - op: replace
        path: /spec/ports/0/targetPort
        value: 10080
      - op: replace
        path: /spec/ports/1/targetPort
        value: 10443
