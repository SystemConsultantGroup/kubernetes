apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bunkerweb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://repo.bunkerweb.io/charts
      chart: bunkerweb
      targetRevision: 1.3.0
      helm:
        releaseName: bunkerweb
        valueFiles:
          - $values/argocd/platform/bunkerweb/values.yaml
    - repoURL: https://github.com/SystemConsultantGroup/kubernetes.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/SystemConsultantGroup/kubernetes.git
      targetRevision: main
      path: argocd/platform/bunkerweb/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: bunkerweb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
