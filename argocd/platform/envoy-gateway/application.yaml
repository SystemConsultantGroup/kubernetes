apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: oci://docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: v1.9.1
      helm:
        releaseName: envoy-gateway
        valueFiles:
          - $values/argocd/platform/envoy-gateway/values.yaml
    - repoURL: https://github.com/envoyproxy/gateway.git
      targetRevision: v1.9.1
      path: charts/gateway-helm/charts/crds/crds/generated
      directory:
        recurse: true
    - repoURL: https://github.com/SystemConsultantGroup/kubernetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
