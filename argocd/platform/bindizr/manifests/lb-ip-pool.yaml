# Gives the bindizr LoadBalancer Services the node address below, shared
# between bindizr-bind9 (port 53, BIND) and bindizr (port 5300, the bindizr
# primary's own DNS listener). The node already owns it, so no L2 or BGP announcement is
# needed: Cilium's datapath matches <address>:<port> as a service frontend.
# The parent zone's NS glue points at this address.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: bindizr-dns
spec:
  blocks:
    - start: 115.145.172.17
      stop: 115.145.172.17
  allowFirstLastIPs: "Yes"
  # Only bindizr's two public Services may take an address from this pool.
  serviceSelector:
    matchLabels:
      app.kubernetes.io/instance: bindizr
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [bind9, bindizr]
