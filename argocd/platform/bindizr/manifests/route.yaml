# Public entry for the web UI. The UI relays API calls to bindizr-api:8000
# inside the cluster, so the API itself is not routed externally.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bindizr
  namespace: bindizr
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: platform-https
  hostnames:
    - dns.platform.scg.sh
  rules:
    - backendRefs:
        - name: bindizr-ui
          port: 9000
