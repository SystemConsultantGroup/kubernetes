# External entry for the bindizr primary's DNS listener: the same load
# balancer address as the BIND Service, on port 5300 (TCP and UDP). This is
# where RFC 2136 dynamic updates (certbot, nsupdate) and TSIG-signed zone
# transfers for secondaries outside the cluster arrive; BIND on port 53 is a
# secondary and refuses both. Cilium LB IPAM lets the two Services share the
# address because they carry the same sharing-key and use different ports.
apiVersion: v1
kind: Service
metadata:
  name: bindizr
  namespace: bindizr
  labels:
    app.kubernetes.io/name: bindizr-chart
    app.kubernetes.io/instance: bindizr
    app.kubernetes.io/component: bindizr
  annotations:
    lbipam.cilium.io/sharing-key: bindizr-dns
    lbipam.cilium.io/ips: "115.145.172.17"
spec:
  type: LoadBalancer
  ports:
    - name: dns-tcp
      port: 5300
      targetPort: dns-tcp
      protocol: TCP
    - name: dns-udp
      port: 5300
      targetPort: dns-udp
      protocol: UDP
  selector:
    app.kubernetes.io/name: bindizr-chart
    app.kubernetes.io/instance: bindizr
    app.kubernetes.io/component: bindizr
