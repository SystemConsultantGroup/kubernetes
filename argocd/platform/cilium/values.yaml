operator:
  replicas: 2
ipam:
  mode: kubernetes
kubeProxyReplacement: true
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
k8sServiceHost: localhost
k8sServicePort: 7445
# Envoy Gateway owns the Gateway API data plane. Cilium remains the CNI,
# kube-proxy replacement, and network-policy engine. Cilium's Envoy DaemonSet
# is disabled so it cannot collide with Envoy Gateway's host-networked proxy.
gatewayAPI:
  enabled: false
envoy:
  enabled: false
