apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: application-wildcards
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: application-wildcards-tls
  issuerRef:
    kind: ClusterIssuer
    name: zerossl-cloudflare
  dnsNames:
    - "*.testing.scg.sh"
    - "*.preview.scg.sh"
