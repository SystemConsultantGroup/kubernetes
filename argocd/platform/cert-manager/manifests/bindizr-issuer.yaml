apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: zerossl-bindizr
spec:
  acme:
    email: scg@scg.skku.ac.kr
    server: https://acme.zerossl.com/v2/DV90
    disableAccountKeyGeneration: true
    privateKeySecretRef:
      name: zerossl-cloudflare-account
    solvers:
      - selector:
          dnsNames:
            - test.alumni.scg.skku.ac.kr
            - admin.test.alumni.scg.skku.ac.kr
            - api.test.alumni.scg.skku.ac.kr
        dns01:
          rfc2136:
            nameserver: bindizr-dns.bindizr.svc.cluster.local:53
            protocol: TCP
            tsigKeyName: alumni-acme
            tsigAlgorithm: HMACSHA256
            tsigSecretSecretRef:
              name: bindizr-rfc2136
              key: tsig-secret
