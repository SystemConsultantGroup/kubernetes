apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-dns-vault-auth
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cert-manager-dns
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: https://vault.platform.scg.sh
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: cert-manager-dns
          serviceAccountRef:
            name: cert-manager-dns-vault-auth
            audiences:
              - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bindizr-rfc2136
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: cert-manager-dns
  target:
    name: bindizr-rfc2136
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: tsig-secret
      remoteRef:
        key: platform/cert-manager/bindizr
        property: TSIG_SECRET
