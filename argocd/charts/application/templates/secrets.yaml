{{- $context := required "_context is required" .Values._context -}}
{{- $application := required "_context.application is required" $context.application -}}
{{- $instance := required "_context.instance is required" $context.instance -}}
{{- $instanceType := required "_context.instance.type is required" $instance.type -}}
{{- $secrets := $context.secrets | default (dict) -}}
{{- if ($secrets.enabled | default false) -}}
{{- $server := required "_context.secrets.server is required when secrets are enabled" $secrets.server -}}
{{- $workloads := omit .Values "_context" -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  labels:
    app.kubernetes.io/name: vault-auth
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    app.kubernetes.io/part-of: {{ $application | quote }}
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
    platform.scg.sh/instance-type: {{ $instanceType | quote }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    app.kubernetes.io/part-of: {{ $application | quote }}
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
    platform.scg.sh/instance-type: {{ $instanceType | quote }}
spec:
  provider:
    vault:
      server: {{ $server | quote }}
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: applications
          serviceAccountRef:
            name: vault-auth
            audiences:
              - vault
{{ range $name, $workload := $workloads -}}
  {{- $render := or (ne $instanceType "preview") (eq $name $instance.workload) -}}
  {{- if $render -}}
    {{- $secretName := include "application.secretName" (dict "root" $ "workload" $name) -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "application.commonLabels" (dict "root" $ "workload" $name) | nindent 4 }}
spec:
  refreshPolicy: Periodic
  refreshInterval: 15s
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    deletionPolicy: Delete
  dataFrom:
    {{- if eq $instanceType "preview" }}
    - extract:
        key: {{ printf "applications/%s/testing/%s" $application $name | quote }}
    - extract:
        key: {{ printf "applications/%s/preview/%s" $application $name | quote }}
    {{- else }}
    - extract:
        key: {{ printf "applications/%s/%s/%s" $application $instanceType $name | quote }}
    {{- end }}
  {{- end -}}
{{- end -}}
{{- end -}}
