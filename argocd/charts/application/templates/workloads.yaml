{{- $context := required "_context is required" .Values._context -}}
{{- $application := required "_context.application is required" $context.application -}}
{{- $instance := required "_context.instance is required" $context.instance -}}
{{- $instanceType := required "_context.instance.type is required" $instance.type -}}
{{- $secrets := $context.secrets | default (dict) -}}
{{- $secretsEnabled := $secrets.enabled | default false -}}
{{- $workloads := omit .Values "_context" -}}
{{- if eq (len $workloads) 0 -}}
  {{- fail "at least one workload is required" -}}
{{- end -}}
{{- if eq $instanceType "preview" -}}
  {{- $previewWorkload := required "preview instance workload is required" $instance.workload -}}
  {{- if not (hasKey $workloads $previewWorkload) -}}
    {{- fail (printf "preview workload %q does not exist" $previewWorkload) -}}
  {{- end -}}
{{- end -}}

{{- range $name, $workload := $workloads -}}
  {{- $render := or (ne $instanceType "preview") (eq $name $instance.workload) -}}
  {{- if $render -}}
    {{- $source := required (printf "workload %q has no source lock" $name) $workload.source -}}
    {{- $image := required (printf "workload %q has no image lock" $name) $workload.image -}}
    {{- $resourceName := include "application.workloadName" (dict "root" $ "workload" $name) -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $resourceName }}
  labels:
    {{- include "application.commonLabels" (dict "root" $ "workload" $name) | nindent 4 }}
  annotations:
    platform.scg.sh/source-repository: {{ $source.repository | quote }}
    platform.scg.sh/source-revision: {{ $source.revision | quote }}
    reloader.stakater.com/auto: "true"
    {{- if hasPrefix "https://github.com/" $source.repository }}
    link.argocd.argoproj.io/source: {{ printf "%s/commit/%s" (trimSuffix ".git" $source.repository) $source.revision | quote }}
    {{- end }}
spec:
  replicas: {{ ternary 1 ($workload.replicas | default 1) (eq $instanceType "preview") }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name | quote }}
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
  template:
    metadata:
      labels:
        {{- include "application.commonLabels" (dict "root" $ "workload" $name) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- with $workload.http }}
          ports:
            - name: http
              containerPort: {{ .port }}
              protocol: TCP
          {{- end }}
          {{- with $workload.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $secretsEnabled $workload.envFrom }}
          envFrom:
            {{- if $secretsEnabled }}
            - secretRef:
                name: {{ include "application.secretName" (dict "root" $ "workload" $name) }}
                optional: true
            {{- end }}
            {{- with $workload.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with $workload.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $workload.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
    {{- with $workload.http }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $resourceName }}
  labels:
    {{- include "application.commonLabels" (dict "root" $ "workload" $name) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name | quote }}
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      appProtocol: http
    {{ end }}
  {{ end }}
{{ end }}
