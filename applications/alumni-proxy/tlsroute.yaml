apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: alumni
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: gateway-system
      sectionName: scg-skku-passthrough
  hostnames:
    - "*.scg.skku.ac.kr"
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: alumni-origin
